<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Screening Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
            color: #1f2937;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 200px;
            margin-top: 10px;
        }

        input[type="file"] {
            margin-top: 10px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>AI Resume Screening Platform</h1>

    <form action="/upload-resume" method="post" enctype="multipart/form-data">

        <label><b>Upload Resume (PDF)</b></label><br>
        <input type="file" name="file" required>

        <br><br>

        <label><b>Paste Job Description</b></label><br>
        <textarea name="job_description" required></textarea>

        <br>

        <button type="submit">Analyze Resume</button>

    </form>

</div>

</body>
</html>
